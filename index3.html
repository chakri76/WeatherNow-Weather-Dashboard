
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>🌦️ WeatherNow</h1>
            <p>Real-Time Weather Dashboard</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="message" role="status"></p>

        <section id="weatherDisplay" class="weather-card hidden">
            <h2 id="cityName">City</h2>
            <p id="date"></p>

            <div class="main-weather">
                <span id="weatherIcon">🌤️</span>
                <h1><span id="temperature">--</span>°C</h1>
                <p id="description">Weather condition</p>
                <p>Feels like <span id="feelsLike">--</span>°C</p>
            </div>

            <div class="weather-details">
                <div class="detail">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p id="wind">-- km/h</p>
                </div>

                <div class="detail">
                    <span>🌧️</span>
                    <h3>Precipitation</h3>
                    <p id="rain">-- mm</p>
                </div>
            </div>

            <p class="updated" id="updated"></p>
        </section>
        <footer>
            <p>Powered by Open-Meteo API</p>
            <p>Created with HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
